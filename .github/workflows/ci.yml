name: Beasell CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    env:
      CONVEX_DEPLOYMENT: prod:beasell-ci
      SITE_URL: https://beasell-ci.invalid
      NEXT_PUBLIC_SITE_URL: https://beasell-ci.invalid
      BETTER_AUTH_TRUSTED_ORIGINS: https://beasell-ci.invalid
      NEXT_PUBLIC_CONVEX_URL: https://beasell-ci.convex.cloud
      NEXT_PUBLIC_CONVEX_SITE_URL: https://beasell-ci.convex.site
      BETTER_AUTH_SECRET: ci-placeholder-secret-with-at-least-32-characters
      ADMIN_EMAILS: owner@beasell-ci.invalid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret scan
        run: |
          if git grep -n -E '(sk-[A-Za-z0-9_-]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}|ghp_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |OPENSSH |EC |DSA |)PRIVATE KEY-----)' -- . ':!package-lock.json'; then
            echo "Potential secret found in repository content."
            exit 1
          fi

      - name: Validate example environment
        run: npm run qa:env:example

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: NEXT_TELEMETRY_DISABLED=1 npm run build
